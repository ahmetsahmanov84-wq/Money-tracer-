</style></head><body><div id="app"><header class="top"><div class="brand"><span class="logo">ᴍ</span> Money Tracker</div><h1 id="heading">Главная</h1><p id="subtitle">Обзор финансов</p><img id="art" class="art" src="home.png" alt=""></header><main id="view" class="content"></main><nav id="nav" class="nav"></nav></div><script>
'use strict';const $=s=>document.querySelector(s),view=$('#view');const cats=['Коммунальные / квартира','Еда','Знания','Выход на улицу','Больничные','Карманные — Ахмед','Карманные — Джамиля','Карманные — Усман'],catIcons=['⌂','🛒','▤','☕','♡','♙','♙','♧'],pages=[['Главная','⌂','home'],['Категории','▦','categories'],['Доходы','▤','income'],['Аналитика','▥','analytics'],['Настройки','⚙','settings'],['Долги','▱','debts']];const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},money=n=>(+n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₺',short=s=>s?s.split('-').reverse().join('.'):'—',safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now()+Math.floor(Math.random()*10000);let db={expenses:[],incomes:[],debts:[],budget:300000,limits:[60000,50000,20000,12000,15000,10000,10000,8000],lock:false,lockDelay:'1',pin:''};try{let x=JSON.parse(localStorage.getItem('money-tracker-final-v1'));if(x&&Array.isArray(x.expenses)&&Array.isArray(x.incomes)&&Array.isArray(x.debts))db={...db,...x}}catch(e){}let page=0,mode='',type='',editId=null,category=1,period='month',debtType='lent',repayId=null,calendarDate=today(),calMonth=new Date().getMonth(),calYear=new Date().getFullYear(),monthOffset=0,catTab='expenses';const save=()=>localStorage.setItem('money-tracker-final-v1',JSON.stringify(db)),total=(a)=>a.reduce((s,x)=>s+x.amount,0),income=()=>total(db.incomes.filter(x=>x.status==='received')),expense=()=>total(db.expenses),summary=(inc,exp)=>`<div class="card summary"><div><span>🟢 Доходы</span><strong class="green">+${money(inc)}</strong></div><div><span>🟠 Расходы</span><strong class="red">−${money(exp)}</strong></div><div><span>⚖ Баланс</span><strong class="green">${money(inc-exp)}</strong></div></div>`,btn=(label,act,cls='')=>`<button class="btn ${cls}" data-act="${act}">${label}</button>`,item=(icon,name,desc,amount,act='',color='red')=>`<div class="item" ${act?`data-act="${act}" style="cursor:pointer"`:''}><div class="symbol">${icon}</div><div class="details"><b>${safe(name)}</b><small>${safe(desc)}</small></div><strong class="amount ${color}">${amount}</strong>${act?'<span class="arrow">›</span>':''}</div>`,pill=(opts,active,prefix)=>`<div class="pillrow">${opts.map(([k,t])=>`<button data-act="${prefix}${k}" class="${active===k?'on':''}">${t}</button>`).join('')}</div>`,periodStart=()=>{let d=new Date();if(period==='day')return today();if(period==='week')d.setDate(d.getDate()-(d.getDay()+6)%7);else if(period==='month')d.setDate(1);else {d.setMonth(0);d.setDate(1)}return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},inPeriod=x=>x.date>=periodStart()&&x.date<=today();function draw(){const title=mode==='calendar'?'Календарь отчётов':mode==='history'?cats[category]:mode==='form'?(editId?'Редактирование':'Добавление'):mode==='repay'?'Возврат долга':pages[page][0];$('#heading').textContent=title;$('#subtitle').textContent=mode==='calendar'?'Просмотр и анализ по дням':mode==='history'?'История расходов':mode==='form'?'Данные операции':mode==='repay'?'Учёт возвратов':['Обзор финансов','Управление расходами по категориям','Учёт всех поступлений','Графики, структура и сравнение','Управление приложением и данными','Учёт долгов: выданные и полученные'][page];$('#art').src=(mode==='calendar'?'calendar':pages[page][2])+'.png';$('#nav').innerHTML=pages.map((p,i)=>`<button data-page="${i}" class="${!mode&&page===i?'on':''}"><span class="ico">${p[1]}</span>${p[0]}</button>`).join('');if(mode==='form')return form();if(mode==='repay')return repay();if(mode==='calendar')return calendar();if(mode==='history')return history();if(page===0)return home();if(page===1)return categories();if(page===2)return incomes();if(page===3)return analytics();if(page===4)return settings();if(page===5)return debts()}
function home(){let date=today(),recent=[...db.expenses.map(x=>({...x,kind:'e'})),...db.incomes.map(x=>({...x,kind:'i'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);view.innerHTML=`<div class="datebar"><button data-act="calendar">‹</button><span>▦ ${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}</span><button data-act="calendar">›</button></div>${summary(income(),expense())}<div class="section">Быстрые действия</div><div class="quick">${[['＋','Доход','add-income'],['−','Расход','add-expense'],['⇄','Перевод','transfer'],['▤','Долг','add-debt']].map(([ic,t,a])=>`<button data-act="${a}"><span class="symbol">${ic}</span>${t}</button>`).join('')}</div><div class="section">Последние операции <button class="smallbtn" data-act="calendar" style="float:right">См. все ›</button></div><div class="card">${recent.length?recent.map(x=>item(x.kind==='e'?catIcons[x.category]:'⌂',x.name,short(x.date)+(x.kind==='e'?' · '+cats[x.category]:''),(x.kind==='e'?'−':'+')+money(x.amount),x.kind==='e'?'edit-expense-'+x.id:'edit-income-'+x.id,x.kind==='e'?'red':'green')).join(''):'<p class="note center">Операций пока нет. Добавь первую!</p>'}</div>`}
function categories(){let values=cats.map((_,i)=>total(db.expenses.filter(x=>x.category===i)));view.innerHTML=pill([['expenses','Расходы'],['income','Доходы']],catTab,'cattab-')+(catTab==='income'?`<div class="card">${db.incomes.length?db.incomes.map(x=>item('↗',x.name,short(x.date),'+'+money(x.amount),'edit-income-'+x.id,'green')).join(''):'<p class="note">Пока нет доходов</p>'}</div>`:`<div class="card">${cats.map((c,i)=>item(catIcons[i],c,'Лимит '+money(db.limits[i]),'−'+money(values[i]),'cat-'+i)).join('')}</div><p class="note center">Нажми на категорию, чтобы добавить расход</p>`)}
function incomes(){let month=new Date();month.setMonth(month.getMonth()+monthOffset);let key=month.toISOString().slice(0,7),list=db.incomes.filter(x=>x.date.startsWith(key)),sum=total(list.filter(x=>x.status==='received'));view.innerHTML=`<div class="datebar"><button data-act="income-prev">‹</button><span>▦ ${month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</span><button data-act="income-next">›</button></div><div class="card center"><span class="muted">↗ Общий доход</span><div class="big green">+${money(sum)}</div></div>${btn('＋ Добавить доход','add-income','full')}<div class="card" style="margin-top:12px">${list.length?list.map(x=>item('⌂',x.name,short(x.date)+(x.status==='expected'?' · Ожидается':''),'+'+money(x.amount),'edit-income-'+x.id,'green')).join(''):'<p class="note center">За месяц доходов нет</p>'}</div>`}
function analytics(){let es=db.expenses.filter(inPeriod),inc=total(db.incomes.filter(x=>x.status==='received'&&inPeriod(x))),exp=total(es),vals=cats.map((_,i)=>total(es.filter(x=>x.category===i))),colors=['#ff780d','#ffb047','#60b8ff','#b86bee','#68b951','#b5b1ac','#d87572','#f6d18c'];let pos=0,stops=vals.map((v,i)=>{let a=pos;pos+=exp?v/exp*100:0;return `${colors[i]} ${a}% ${pos}%`});view.innerHTML=pill([['day','День'],['week','Неделя'],['month','Месяц'],['year','Год']],period,'period-')+`<div class="datebar"><span></span><span>▦ ${new Date().toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</span><span></span></div>${summary(inc,exp)}<div class="section">Расходы по категориям</div><div class="card"><div class="row" style="justify-content:center;gap:17px"><div class="donut" style="background:${exp?'conic-gradient('+stops.join(',')+')':'#f1e1d8'}"><div>${money(exp)}</div></div><div class="legend">${cats.slice(0,6).map((c,i)=>`<span><i style="background:${colors[i]}"></i>${safe(c)} ${exp?Math.round(vals[i]/exp*100):0}%</span>`).join('')}</div></div>${cats.map((c,i)=>item(catIcons[i],c,exp?Math.round(vals[i]/exp*100)+'% расходов':'0%','−'+money(vals[i]),'history-'+i)).join('')}</div>`}
function history(){let list=db.expenses.filter(x=>x.category===category&&inPeriod(x));view.innerHTML=btn('‹ Назад','back','secondary')+`<div class="card" style="margin-top:12px"><span class="muted">Всего потрачено</span><div class="big red">${money(total(list))}</div><p class="note">${list.length} операций за выбранный период</p></div><div class="card">${list.length?list.sort((a,b)=>b.date.localeCompare(a.date)).map(x=>item('◉',x.name,short(x.date),'−'+money(x.amount))).join(''):'<p class="note">Операций нет</p>'}</div>`}
function debts(){let list=db.debts.filter(x=>x.type===debtType),issued=total(list.filter(x=>x.transferred)),paid=list.filter(x=>x.transferred).reduce((s,x)=>s+x.paid,0);view.innerHTML=pill([['lent','Я дал'],['borrowed','Мне должны' /* replaced below */]],debtType,'debt-tab-').replace('Мне должны','Я взял')+`<div class="center" style="margin:10px">${btn('＋ Добавить долг','add-debt')}</div><div class="card">${list.length?list.map(x=>`<div class="item"><div class="symbol">♙</div><div class="details"><b>${safe(x.name)}</b><small>Выдан: ${short(x.issued)} · ${!x.transferred?'Не переданы':x.paid>=x.amount?'Возвращён':'Ожидается'}</small></div><strong class="amount orange">${money(x.amount-x.paid)}</strong><button class="smallbtn" data-act="edit-debt-${x.id}">›</button></div>${x.transferred&&x.paid<x.amount?`<div class="row" style="padding:5px 0 10px">${btn('Частичный возврат','repay-'+x.id,'secondary')}${btn('Вернул всё','all-'+x.id,'greenbtn')}</div>`:''}`).join(''):'<p class="note center">Долгов пока нет</p>'}</div><div class="card summary"><div><span>Всего</span><strong>${money(issued)}</strong></div><div><span>Возвращено</span><strong class="green">${money(paid)}</strong></div><div><span>Остаток</span><strong class="orange">${money(issued-paid)}</strong></div></div>`}
function calendar(){let first=new Date(calYear,calMonth,1),offset=(first.getDay()+6)%7,count=new Date(calYear,calMonth+1,0).getDate(),date=new Date(calYear,calMonth,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'}),cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<b style="padding:7px 0">${x}</b>`).join('')+Array(offset).fill('<div></div>').join('');for(let i=1;i<=count;i++){let day=[calYear,String(calMonth+1).padStart(2,'0'),String(i).padStart(2,'0')].join('-');cells+=`<button data-act="day-${day}" class="${day===today()?'current':''} ${day===calendarDate?'selected':''}">${i}${day<today()?'<em>✓</em>':day===today()?'<em>▣</em>':''}</button>`}let es=db.expenses.filter(x=>x.date===calendarDate),ins=db.incomes.filter(x=>x.date===calendarDate&&x.status==='received');view.innerHTML=`<div class="datebar"><button data-act="cal-prev">‹</button><span>▦ ${date}</span><button data-act="cal-next">›</button></div><div class="card summary"><div><span>✓ Закрытые дни</span><strong class="green">${Math.max(0,Math.min(count,new Date().getDate()-1))}</strong></div><div><span>▣ Сегодня</span><strong class="orange">${new Date().getDate()}</strong></div><div><span>Месяц</span><strong>${calMonth+1}</strong></div></div><div class="card"><div class="calgrid">${cells}</div><p class="note center">✓ Закрытый день · 🟠 Сегодня</p></div><div class="card"><b>▦ ${short(calendarDate)}</b><span class="muted" style="float:right">${calendarDate<today()?'🔒 Закрыт':calendarDate===today()?'Сегодня':'Будущий день'}</span>${summary(total(ins),total(es))}<b>Подробный отчёт за день</b>${[...es.map(x=>({...x,k:'e'})),...ins.map(x=>({...x,k:'i'}))].map(x=>item(x.k==='e'?'◉':'↗',x.name,x.k==='e'?cats[x.category]:'Доход',(x.k==='e'?'−':'+')+money(x.amount),'',x.k==='e'?'red':'green')).join('')||'<p class="note">Операций за день нет</p>'}</div>`}
function settings(){view.innerHTML=`<div class="card"><b class="orange">▤</b> <b>Учёт и валюта</b>${item('₺','Валюта','Основная валюта','Турецкая лира (₺)')}${item('▦','Начало финансового дня','Автоматическое закрытие','00:00')}</div><div class="card"><b class="orange">◎</b> <b>Бюджеты и лимиты</b><label class="fieldlabel">Ежемесячный бюджет ₺</label><input id="budget" class="field" type="number" min="0" value="${db.budget}">${cats.map((c,i)=>`<label class="fieldlabel">${safe(c)}</label><input class="field" data-limit="${i}" type="number" min="0" value="${db.limits[i]||0}">`).join('')}${btn('Сохранить лимиты','save-settings','full')}</div><div class="card"><b class="orange">▤</b> <b>Данные</b>${item('↓','Экспорт отчётов','CSV','›','export-csv','')}${item('↓','Экспорт копии','JSON','›','export-json','')}${item('↑','Импорт данных','JSON','›','import-json','')}<input type="file" id="importfile" accept="application/json,.json" style="display:none"></div><div class="card"><b class="orange">♙</b> <b>Безопасность</b><p class="note">Для надёжного Face ID в веб-приложении необходима отдельная реализация через поддерживаемую платформой аутентификацию. Сейчас Face ID не включён.</p></div>`}
function form(){let list=type==='expense'?db.expenses:type==='income'?db.incomes:db.debts,old=list.find(x=>x.id===editId);let fields=type==='expense'?`<label class="fieldlabel">Категория</label><select class="field" name="category">${cats.map((c,i)=>`<option value="${i}" ${(old?.category??category)===i?'selected':''}>${safe(c)}</option>`).join('')}</select>`:'';fields+=`<label class="fieldlabel">Название</label><input class="field" name="name" required placeholder="Название операции" value="${safe(old?.name||'')}"><label class="fieldlabel">Сумма (₺)</label><input class="field" name="amount" type="number" min="0.01" step="0.01" required value="${old?.amount||''}"><label class="fieldlabel">Дата</label><input class="field" name="date" type="date" required ${type==='expense'?'max="'+today()+'"':''} value="${old?.date||old?.issued||today()}">`;if(type==='income')fields+=`<label class="fieldlabel">Статус</label><select class="field" name="status"><option value="received" ${old?.status!=='expected'?'selected':''}>Получен</option><option value="expected" ${old?.status==='expected'?'selected':''}>Ожидается</option></select>`;if(type==='debt')fields+=`<label class="fieldlabel">Ожидаемая дата возврата</label><input class="field" name="due" type="date" value="${old?.due||''}"><label class="fieldlabel"><input type="checkbox" name="transferred" ${old?.transferred!==false?'checked':''}> Деньги переданы</label><p></p>`;fields+=`<label class="fieldlabel">Комментарий (необязательно)</label><textarea class="field" name="comment" rows="2">${safe(old?.comment||'')}</textarea>`;view.innerHTML=btn('‹ Назад','back','secondary')+`<form id="entry" class="card formbox" style="margin-top:12px">${fields}<div class="center">${btn('Сохранить','submit','')}</div>${editId&&type==='expense'&&old?.date===today()?'<p class="center"><button class="smallbtn" type="button" data-act="delete-expense">Удалить расход</button></p>':''}</form>`}
function repay(){let x=db.debts.find(x=>x.id===repayId);if(!x){mode='';draw();return}let rem=x.amount-x.paid;view.innerHTML=btn('‹ Назад','back','secondary')+`<div class="card center" style="margin-top:12px"><b>${safe(x.name)}</b><p class="muted">Осталось вернуть</p><div class="big orange">${money(rem)}</div></div><form id="repayment" class="card"><label class="fieldlabel">Частичный возврат</label><input class="field" type="number" name="amount" min="0.01" step="0.01" max="${rem}" required>${btn('Записать возврат','submit','full')}</form>${btn('✓ Вернул всё','all-'+x.id,'greenbtn full')}`}
function exportFile(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function goForm(t,id=null){type=t;editId=id;mode='form';draw()}function update(){save();draw()}
$('#app').addEventListener('click',e=>{let b=e.target.closest('button,[data-act]');if(!b)return;if(b.dataset.page!==undefined){page=+b.dataset.page;mode='';draw();return}let a=b.dataset.act;if(!a)return;if(a==='submit')return;if(a==='back'){mode='';draw();return}if(a==='calendar'){mode='calendar';draw();return}if(a==='add-expense'){category=1;goForm('expense');return}if(a==='add-income'){goForm('income');return}if(a==='add-debt'){goForm('debt');return}if(a==='transfer'){alert('Переводы между счетами появятся после добавления счетов. Сейчас доступны доходы, расходы и долги.');return}if(a.startsWith('cat-')){category=+a.slice(4);goForm('expense');return}if(a.startsWith('cattab-')){catTab=a.slice(7);draw();return}if(a.startsWith('period-')){period=a.slice(7);draw();return}if(a.startsWith('history-')){category=+a.slice(8);mode='history';draw();return}if(a.startsWith('debt-tab-')){debtType=a.slice(9);draw();return}if(a.startsWith('edit-')){let m=a.match(/^edit-(expense|income|debt)-(\d+)$/);if(m)goForm(m[1],+m[2]);return}if(a.startsWith('repay-')){repayId=+a.slice(6);mode='repay';draw();return}if(a.startsWith('all-')){let x=db.debts.find(x=>x.id===+a.slice(4));if(x&&confirm('Отметить весь оставшийся долг возвращённым?')){x.paid=x.amount;mode='';update()}return}if(a==='delete-expense'){let x=db.expenses.find(x=>x.id===editId);if(x?.date===today()&&confirm('Удалить расход?')){db.expenses=db.expenses.filter(x=>x.id!==editId);mode='';update()}return}if(a==='cal-prev'||a==='cal-next'){let d=new Date(calYear,calMonth+(a==='cal-next'?1:-1),1);calYear=d.getFullYear();calMonth=d.getMonth();draw();return}if(a.startsWith('day-')){calendarDate=a.slice(4);draw();return}if(a==='income-prev'||a==='income-next'){monthOffset+=a==='income-next'?1:-1;draw();return}if(a==='save-settings'){let n=+$('#budget').value;if(!Number.isFinite(n)||n<0)return alert('Проверь бюджет');db.budget=n;document.querySelectorAll('[data-limit]').forEach(x=>{let v=+x.value;if(Number.isFinite(v)&&v>=0)db.limits[+x.dataset.limit]=v});update();alert('Настройки сохранены');return}if(a==='export-json'){exportFile('money-tracker-backup.json',JSON.stringify(db,null,2),'application/json');return}if(a==='export-csv'){let rows=[['Тип','Дата','Название','Сумма','Категория/статус'],...db.expenses.map(x=>['Расход',x.date,x.name,x.amount,cats[x.category]]),...db.incomes.map(x=>['Доход',x.date,x.name,x.amount,x.status]),...db.debts.map(x=>['Долг',x.issued,x.name,x.amount,x.type])];exportFile('money-tracker.csv','\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8');return}if(a==='import-json'){$('#importfile').click();return}});
$('#app').addEventListener('submit',e=>{if(e.target.id==='entry'){e.preventDefault();let f=new FormData(e.target),name=String(f.get('name')||'').trim(),amount=+f.get('amount'),date=String(f.get('date')||'');if(!name||!Number.isFinite(amount)||amount<=0||!date)return;if(type==='expense'){if(date!==today())return alert('Расходы можно добавлять только за сегодня');let old=db.expenses.find(x=>x.id===editId);if(old&&old.date!==today())return alert('Закрытый день нельзя изменять');let x={id:editId||uid(),name,amount,date,category:+f.get('category'),comment:String(f.get('comment')||'')};db.expenses=editId?db.expenses.map(a=>a.id===editId?x:a):[x,...db.expenses];page=1}else if(type==='income'){let x={id:editId||uid(),name,amount,date,status:String(f.get('status')),comment:String(f.get('comment')||'')};db.incomes=editId?db.incomes.map(a=>a.id===editId?x:a):[x,...db.incomes];page=2}else{let old=db.debts.find(x=>x.id===editId);if(old&&amount<old.paid)return alert('Сумма меньше уже возвращённой');let x={id:editId||uid(),type:old?.type||debtType,name,amount,issued:date,due:String(f.get('due')||''),transferred:f.has('transferred'),paid:old?.paid||0,comment:String(f.get('comment')||'')};db.debts=editId?db.debts.map(a=>a.id===editId?x:a):[x,...db.debts];page=5}mode='';update()}if(e.target.id==='repayment'){e.preventDefault();let x=db.debts.find(x=>x.id===repayId),n=+new FormData(e.target).get('amount');if(x&&n>0&&n<=x.amount-x.paid){x.paid=Math.round((x.paid+n)*100)/100;mode='';update()}}});document.addEventListener('change',async e=>{if(e.target.id!=='importfile')return;try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.expenses)||!Array.isArray(x.incomes)||!Array.isArray(x.debts))throw Error('Неверная структура');if(confirm('Заменить все текущие данные данными из файла?')){db={...db,...x};update()}}catch(err){alert('Не удалось импортировать JSON: '+err.message)}});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));draw();
</script></body></html>
